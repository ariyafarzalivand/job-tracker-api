[tool.ruff]
line-length = 88
# Migrations are generated by Django, so they are not checked or reformatted.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# E/W: pycodestyle errors and warnings, F: pyflakes (unused imports and
# variables), I: import sorting, B: common bugs, DJ: Django-specific checks.
select = ["E", "W", "F", "I", "B", "DJ"]
[tool.ruff.lint.per-file-ignores]
# Django's default validator paths are long and cannot be shortened.
"config/settings.py" = ["E501"]
