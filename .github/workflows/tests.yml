name: Tests

# Run on every push and every pull request.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # settings.py reads these from the environment. The real .env file
      # is not in the repository, so CI needs its own throwaway values.
      SECRET_KEY: ci-only-secret-key
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          # Re-install dependencies when either requirements file changes.
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Fail early on style problems and bugs that ruff can detect.
      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run tests
        run: pytest